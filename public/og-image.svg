<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0E1116;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22FF88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22FF88;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Striped pattern matching hero -->
  <defs>
    <pattern id="stripes" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="rgba(255,255,255,0.12)"/>
      <rect width="4" height="1" y="1" fill="transparent"/>
      <rect width="4" height="1" y="2" fill="transparent"/>
      <rect width="4" height="1" y="3" fill="transparent"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#stripes)"/>

  <!-- Avatar placeholder -->
  <circle cx="1000" cy="120" r="60" fill="#1e293b" stroke="#22FF88" stroke-width="3"/>
  <text x="1000" y="130" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="600" fill="#22FF88" text-anchor="middle">PR</text>

  <!-- Main content -->
  <g transform="translate(80, 120)">
    <!-- Name -->
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="700" fill="#ffffff">
      Pablo Recio
    </text>

    <!-- Title -->
    <text x="0" y="80" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="500" fill="#22FF88">
      Staff Software Engineer
    </text>

    <!-- Subtitle -->
    <text x="0" y="130" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="400" fill="#a1a1aa">
      Python • Data Engineering • Backend Development
    </text>

    <!-- Location -->
    <text x="0" y="180" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#71717a">
      📍 Andalusia, Spain
    </text>
  </g>

  <!-- Tech stack -->
  <g transform="translate(80, 350)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#ffffff">
      Key Technologies:
    </text>

    <!-- Tech badges -->
    <g transform="translate(0, 40)">
      <rect x="0" y="0" width="120" height="40" rx="20" fill="#1e293b" stroke="#22FF88" stroke-width="1"/>
      <text x="60" y="26" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#22FF88" text-anchor="middle">Python</text>

      <rect x="140" y="0" width="100" height="40" rx="20" fill="#1e293b" stroke="#22FF88" stroke-width="1"/>
      <text x="190" y="26" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#22FF88" text-anchor="middle">dbt</text>

      <rect x="260" y="0" width="140" height="40" rx="20" fill="#1e293b" stroke="#22FF88" stroke-width="1"/>
      <text x="330" y="26" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#22FF88" text-anchor="middle">Snowflake</text>

      <rect x="420" y="0" width="100" height="40" rx="20" fill="#1e293b" stroke="#22FF88" stroke-width="1"/>
      <text x="470" y="26" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#22FF88" text-anchor="middle">Kafka</text>
    </g>

    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="80" height="40" rx="20" fill="#1e293b" stroke="#22FF88" stroke-width="1"/>
      <text x="40" y="26" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#22FF88" text-anchor="middle">AWS</text>

      <rect x="100" y="0" width="140" height="40" rx="20" fill="#1e293b" stroke="#22FF88" stroke-width="1"/>
      <text x="170" y="26" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#22FF88" text-anchor="middle">PostgreSQL</text>

      <rect x="260" y="0" width="120" height="40" rx="20" fill="#1e293b" stroke="#22FF88" stroke-width="1"/>
      <text x="320" y="26" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#22FF88" text-anchor="middle">Docker</text>

      <rect x="400" y="0" width="140" height="40" rx="20" fill="#1e293b" stroke="#22FF88" stroke-width="1"/>
      <text x="470" y="26" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#22FF88" text-anchor="middle">Kubernetes</text>
    </g>
  </g>

  <!-- Decorative elements -->
  <circle cx="1000" cy="150" r="3" fill="#22FF88" opacity="0.6"/>
  <circle cx="1050" cy="200" r="2" fill="#22FF88" opacity="0.4"/>
  <circle cx="950" cy="250" r="2.5" fill="#22FF88" opacity="0.5"/>
  <circle cx="1100" cy="300" r="2" fill="#22FF88" opacity="0.3"/>

  <!-- Bottom accent line -->
  <rect x="80" y="580" width="1040" height="2" fill="url(#accent)" opacity="0.8"/>
</svg>
