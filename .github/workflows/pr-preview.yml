name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy-preview:
    name: Deploy PR Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare preview directory
        run: |
          mkdir -p preview
          rsync -av --delete --exclude '.git' --exclude '.github' ./ preview/
          echo "Preview for PR #${{ github.event.number }}" > preview/README.md

      - name: Deploy to previews repo (gh-pages)
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PREVIEWS_TOKEN }}
          external_repository: pablorecio/pablorecio.github.io-previews
          publish_branch: gh-pages
          publish_dir: preview
          destination_dir: pr-${{ github.event.number }}

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.number;
            const url = `https://pablorecio.github.io/pablorecio.github.io-previews/pr-${pr}/`;
            const body = `🚀 PR preview deployed to:\n\n${url}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body
            });

